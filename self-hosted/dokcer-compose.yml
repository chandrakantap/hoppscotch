services:
  hoppscotch-aio:
    image: hoppscotch/hoppscotch
    container_name: hoppscotch-aio
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    ports:
      - "3980:3000"
      - "3897:3100"
      - "3876:3170"
      - "3689:3200"
      - "3080:80"
  hoppscotch-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    user: postgres
    environment:
      # The default user defined by the docker image
      POSTGRES_USER: postgres
      # NOTE: Please UPDATE THIS PASSWORD!
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: hoppscotch
    volumes:
      - "HOPPSCOTCH_PG_DATA:/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: "pg_isready"
      interval: "10s"
      timeout: "5s"
      retries: 10

volumes:
  HOPPSCOTCH_PG_DATA:
    driver: local
